name: Deploy web version

# Publishes the browser build to GitHub Pages whenever a version is tagged,
# so the web version always matches the installers on the Releases page.
# Run it by hand to publish whatever is on the chosen branch or tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # the web build does not need the Electron runtime
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      # before setup-node, which asks Yarn where its cache is: without Corepack that finds the runner's Yarn 1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      # A missing secret only makes the error reports harder to read, so the deploy goes ahead with a warning.
      - name: Build
        env:
          # uploads the source maps to Sentry so error reports show the real code (vite.config.ts)
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not set, so no source maps went to Sentry"
          fi
          yarn build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
