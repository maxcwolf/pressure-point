name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # type-checking and bundling do not need the Electron runtime
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      # before setup-node, which asks Yarn where its cache is: without Corepack that finds the runner's Yarn 1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Check formatting
        run: yarn format:check
      - run: yarn build
      - name: Unit tests
        run: yarn test

  # every new commit message follows Conventional Commits (commitlint.config.js)
  commits:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # before setup-node, which asks Yarn where its cache is: without Corepack that finds the runner's Yarn 1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Check commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        # a brand-new branch has no "before", so then only the latest commit is checked
        run: |
          if [ -z "$FROM" ] || [ "$FROM" = 0000000000000000000000000000000000000000 ]; then
            yarn commitlint --last
          else
            yarn commitlint --from "$FROM" --to "$TO"
          fi

  # the real game in a headless browser, split across machines so the slow part runs side by side
  e2e:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      # before setup-node, which asks Yarn where its cache is: without Corepack that finds the runner's Yarn 1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Work out the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium
      # the cache holds only the browser, not the system libraries it runs on
      - name: Install the browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium
      - name: End-to-end tests (part ${{ matrix.shard }} of 4)
        run: yarn test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # performance: draw calls, GPU memory over a long session and idle work in the browser, which fail
  # on a regression; and the simulation's timings, which are only reported, kept to compare over time
  perf:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      # before setup-node, which asks Yarn where its cache is: without Corepack that finds the runner's Yarn 1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Work out the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium
      # the cache holds only the browser, not the system libraries it runs on
      - name: Install the browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium
      - name: Performance checks
        run: yarn test:perf
      - name: Simulation timings
        if: always()
        run: yarn bench
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results
          path: |
            playwright-report
            test-results
          retention-days: 30

  # the built desktop app, launched for real: the sandbox, the preload API, quitting and saving
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # before setup-node, which asks Yarn where its cache is: without Corepack that finds the runner's Yarn 1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Desktop tests (Linux)
        if: runner.os == 'Linux'
        # Ubuntu blocks the user namespaces Electron's sandbox is built on, and the runner has no display
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum yarn test:desktop
      - name: Desktop tests
        if: runner.os != 'Linux'
        run: yarn test:desktop
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-test-results-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 7
