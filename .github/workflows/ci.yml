name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # type-checking and bundling do not need the Electron runtime
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Check formatting
        run: yarn format:check
      - run: yarn build
      - name: Unit tests
        run: yarn test

  # the real game in a headless browser, split across machines so the slow part runs side by side
  e2e:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Install the browser
        run: yarn playwright install --with-deps chromium
      - name: End-to-end tests (part ${{ matrix.shard }} of 4)
        run: yarn test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # the built desktop app, launched for real: the sandbox, the preload API, quitting and saving
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Desktop tests (Linux)
        if: runner.os == 'Linux'
        # Ubuntu blocks the user namespaces Electron's sandbox is built on, and the runner has no display
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum yarn test:desktop
      - name: Desktop tests
        if: runner.os != 'Linux'
        run: yarn test:desktop
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-test-results-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 7
