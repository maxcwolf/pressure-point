name: Release

# Push a tag like v0.1.0 to build the macOS and Windows installers and publish
# them as a GitHub release. Run it by hand to build without publishing.
#
# Only tags and manual runs trigger this, never pull requests, so code from a
# fork can never reach a self-hosted runner if MAC_RUNNER points at one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            # GitHub-hosted by default (free for public repositories). Set the
            # repository variable MAC_RUNNER to self-hosted to use the Mac mini.
            os: ${{ vars.MAC_RUNNER || 'macos-latest' }}
            args: --mac --arm64 --x64
          - name: Windows
            os: windows-latest
            args: --win --x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # after setup-node, so a self-hosted Mac needs nothing preinstalled
      - run: corepack enable
      - run: yarn install --immutable
      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./package.json').version")-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - run: yarn build
      - name: Unit tests
        run: yarn test
      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          # same secret names as the other macOS release pipelines
          DEVELOPER_ID_CERT_BASE64: ${{ matrix.name == 'macOS' && secrets.DEVELOPER_ID_CERT_BASE64 || '' }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ matrix.name == 'macOS' && secrets.DEVELOPER_ID_CERT_PASSWORD || '' }}
          NOTARIZE_APPLE_ID: ${{ matrix.name == 'macOS' && secrets.NOTARIZE_APPLE_ID || '' }}
          NOTARIZE_PASSWORD: ${{ matrix.name == 'macOS' && secrets.NOTARIZE_PASSWORD || '' }}
          NOTARIZE_TEAM_ID: ${{ matrix.name == 'macOS' && secrets.NOTARIZE_TEAM_ID || '' }}
        run: |
          args=(${{ matrix.args }})
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ -n "$DEVELOPER_ID_CERT_BASE64" ]]; then
              echo "Signing with the Developer ID certificate"
              export CSC_LINK="$DEVELOPER_ID_CERT_BASE64" CSC_KEY_PASSWORD="$DEVELOPER_ID_CERT_PASSWORD"
              if [[ -n "$NOTARIZE_APPLE_ID" ]]; then
                echo "Notarizing with Apple"
                export APPLE_ID="$NOTARIZE_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$NOTARIZE_PASSWORD" APPLE_TEAM_ID="$NOTARIZE_TEAM_ID"
                args+=(-c.mac.notarize=true)
              fi
            else
              # No certificate configured: sign ad hoc, because macOS reports a
              # download with no signature at all as damaged.
              echo "No Developer ID certificate secret, signing ad hoc"
              args+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
            fi
          fi
          yarn electron-builder "${args[@]}" --publish never -c.extraMetadata.version="$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          # this version's section of CHANGELOG.md, then how to play and install
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" installers/* \
            --verify-tag \
            --title "Pressure Point Institute $GITHUB_REF_NAME" \
            --notes-file notes.md
